<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLV Spotting - data source diagnostics</title>
<style>
  body { font: 15px/1.55 system-ui, sans-serif; margin: 0; padding: 16px; background: #0b1220; color: #e9eef7; }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #10151f; } }
  main { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; opacity: .7; font-size: 13.5px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #0b6bcb; color: #fff; cursor: pointer; }
  button.sec { background: transparent; border: 1px solid currentColor; color: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .card { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; font-family: ui-monospace, monospace; word-break: break-all; }
  .verdict { font-weight: 700; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }
  .detail { font-size: 13px; opacity: .85; margin: 4px 0 0; }
  pre { background: rgba(128,128,128,.14); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 220px; }
  .env { font-size: 12.5px; opacity: .75; }
</style>
</head>
<body>
<main>
  <h1>Data source diagnostics</h1>
  <p class="sub">Tests every ADS-B endpoint the site can use, from this browser, and separates "blocked by CORS" from "host unreachable".</p>
  <div class="row">
    <button id="run">Run tests</button>
    <button id="copy" class="sec">Copy results</button>
  </div>
  <p class="env" id="config"></p>
  <div id="out"></div>
  <p class="env" id="env"></p>
</main>
<script type="module">
// Bumped whenever this page changes, so a stale copy is obvious on sight.
const BUILD = "2026-09-06d";

// Ben Gurion, 20 nm.
const LAT = 32.0094, LON = 34.8828, R = 20;

const ENDPOINTS = [
  ["airplanes.live point",  `https://api.airplanes.live/v2/point/${LAT}/${LON}/${R}`],
  ["airplanes.live latlon", `https://api.airplanes.live/v2/lat/${LAT}/lon/${LON}/dist/${R}`],
  ["adsb.fi opendata",      `https://opendata.adsb.fi/api/v2/lat/${LAT}/lon/${LON}/dist/${R}`],
  ["adsb.lol point",        `https://api.adsb.lol/v2/point/${LAT}/${LON}/${R}`],
  ["adsb.lol latlon",       `https://api.adsb.lol/v2/lat/${LAT}/lon/${LON}/dist/${R}`],
  ["adsb.lol v2 closest",   `https://api.adsb.lol/v2/closest/${LAT}/${LON}/${R}`],
];

// Any ?url= parameters are appended, so a candidate proxy can be tested here
// before it is wired into the app.
for (const extra of new URLSearchParams(location.search).getAll("url")) {
  ENDPOINTS.push(["custom: " + extra, extra]);
}

// Include whatever proxy the site is configured to use, so this page tests the
// same path the app takes.
let configNote = "";
try {
  // Cache-busted: a stale config.json is exactly the failure this page exists
  // to catch, so it must never be served from cache here.
  const res = await fetch(`data/config.json?v=${Date.now()}`);
  const cfg = await res.json();
  if (cfg.adsbProxy) {
    const base = cfg.adsbProxy.replace(/\/$/, "");
    ENDPOINTS.unshift(["configured proxy", `${base}/?lat=${LAT}&lon=${LON}&radius=${R}`]);
    configNote = `config.json → adsbProxy = ${cfg.adsbProxy}`;
  } else {
    configNote = "config.json loaded, but adsbProxy is empty - the site has no proxy configured.";
  }
} catch (err) {
  configNote = `Could not read data/config.json (${err.message}) - the proxy cannot be tested.`;
}

const results = [];

// A normal fetch failing tells us nothing about why. Repeating it as no-cors
// does: an opaque response means the request left the machine and came back,
// so the only thing that stopped the first one was the CORS policy.
async function probe(name, url) {
  const started = performance.now();
  const entry = { name, url };

  try {
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    entry.ms = Math.round(performance.now() - started);
    entry.status = res.status;
    if (!res.ok) {
      entry.verdict = "HTTP error";
      entry.cls = "bad";
      entry.detail = `Reachable and CORS is fine, but returned HTTP ${res.status} ${res.statusText}. Likely needs an API key now, or the path changed.`;
      try { entry.body = (await res.text()).slice(0, 400); } catch {}
      return entry;
    }
    // Parse separately from the transport: a response that arrived but is not
    // JSON is a completely different problem from one that never arrived, and
    // must not be reported as a CORS failure.
    const text = await res.text();
    let body;
    try {
      body = JSON.parse(text);
    } catch {
      entry.verdict = "NOT JSON";
      entry.cls = "bad";
      entry.detail = entry.name === "configured proxy"
        ? "The proxy is reachable and CORS is fine, but it did not return JSON. Most likely the Worker still has Cloudflare's default Hello World code - paste worker/adsb-proxy.js into it and redeploy."
        : "Reachable and CORS is fine, but the response is not JSON.";
      entry.body = text.slice(0, 200);
      return entry;
    }
    const list = body.ac || body.aircraft || [];
    entry.verdict = "WORKS";
    entry.cls = "ok";
    entry.count = list.length;
    entry.detail = `HTTP 200 in ${entry.ms}ms, ${list.length} aircraft returned.`;
    entry.sample = list[0] ? JSON.stringify(list[0]).slice(0, 300) : "(empty list)";
    return entry;
  } catch (err) {
    entry.ms = Math.round(performance.now() - started);
    entry.error = `${err.name}: ${err.message}`;

    let opaque = false;
    try {
      await fetch(url, { mode: "no-cors" });
      opaque = true;
    } catch (e2) {
      entry.noCorsError = `${e2.name}: ${e2.message}`;
    }

    if (opaque) {
      entry.verdict = "BLOCKED BY CORS";
      entry.cls = "warn";
      entry.detail = "The host answered, but sends no Access-Control-Allow-Origin header, so the browser will not let this page read the response. A server-side proxy fixes this.";
    } else {
      entry.verdict = "UNREACHABLE";
      entry.cls = "bad";
      entry.detail = "The request never completed even with CORS out of the picture - DNS failure, the host is down, or something on this network is blocking it.";
    }
    return entry;
  }
}

async function run() {
  const out = document.getElementById("out");
  out.innerHTML = "";
  results.length = 0;

  for (const [name, url] of ENDPOINTS) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>${name}</h2><p class="detail">testing…</p>`;
    out.appendChild(card);

    const r = await probe(name, url);
    results.push(r);
    card.innerHTML = `
      <h2>${name}</h2>
      <p class="verdict ${r.cls}">${r.verdict}</p>
      <p class="detail">${r.detail}</p>
      <p class="detail" style="opacity:.6">${r.url}</p>
      ${r.error ? `<p class="detail">first attempt: <code>${r.error}</code></p>` : ""}
      ${r.noCorsError ? `<p class="detail">no-cors attempt: <code>${r.noCorsError}</code></p>` : ""}
      ${r.sample ? `<pre>${r.sample}</pre>` : ""}
      ${r.body ? `<pre>${r.body}</pre>` : ""}
    `;
  }

  const working = results.filter((r) => r.cls === "ok");
  const directWorking = working.filter((r) => r.name !== "configured proxy").length;
  const proxyWorks = working.some((r) => r.name === "configured proxy");

  const banner = document.createElement("div");
  banner.className = "card";
  if (proxyWorks && !directWorking) {
    banner.innerHTML = `<p class="verdict ok">The proxy works - the site has live data.</p><p class="detail">The direct endpoints being blocked is expected: the community networks send no CORS header, which is the reason the proxy exists.</p>`;
  } else if (directWorking) {
    banner.innerHTML = `<p class="verdict ok">${directWorking} direct endpoint(s) work from this browser - the site can run without a proxy.</p>`;
  } else {
    banner.innerHTML = `<p class="verdict bad">No endpoint works from this browser.</p><p class="detail">If they all say BLOCKED BY CORS, the fix is a server-side proxy - see the README. If they say UNREACHABLE, something on this network or in this region is blocking the hosts; try mobile data instead of Wi-Fi to tell those apart.</p>`;
  }
  out.prepend(banner);
}

document.getElementById("run").addEventListener("click", run);
document.getElementById("copy").addEventListener("click", async () => {
  const text = [
    `build: ${BUILD}`,
    `config: ${configNote}`,
    `origin: ${location.origin}`,
    `ua: ${navigator.userAgent}`,
    ...results.map((r) =>
      `${r.name} | ${r.verdict} | status=${r.status ?? "-"} | ${r.ms}ms | err=${r.error ?? "-"} | nocors=${r.noCorsError ?? "-"}`
    ),
  ].join("\n");
  try { await navigator.clipboard.writeText(text); alert("Copied - paste it back to Claude."); }
  catch { prompt("Copy this:", text); }
});

document.getElementById("env").textContent =
  `build ${BUILD} · origin ${location.origin} · ${navigator.userAgent}`;
document.getElementById("config").textContent = configNote;
run();
</script>
</body>
</html>
