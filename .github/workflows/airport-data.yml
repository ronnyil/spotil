name: Fetch airport geometry

# One-shot data gathering. The runway diagram draws all three runways crossing
# at the airport reference point, because only bearings and lengths were known -
# the true positions were never available. OpenStreetMap has the real geometry;
# this prints it so it can be baked into data/airport.json.
#
# Runs from CI because the development environment has no outbound network
# access to Overpass.

on:
  push:
    paths: [".github/workflows/airport-data.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Overpass for LLBG runways
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, math

          Q = ("[out:json][timeout:25];"
               "way(around:4000,32.00944,34.88278)[aeroway=runway];"
               "out geom;")

          # Overpass answers 406 to urllib's default User-Agent, and the query
          # goes in a POST body rather than the query string. Mirrors are tried
          # in turn because the main instance is frequently rate limited.
          MIRRORS = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.osm.ch/api/interpreter",
          ]
          data = None
          for endpoint in MIRRORS:
              req = urllib.request.Request(
                  endpoint,
                  data=urllib.parse.urlencode({"data": Q}).encode(),
                  headers={
                      "User-Agent": "spotil/1.0 (+https://github.com/ronnyil/spotil)",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.load(r)
                  print("source:", endpoint)
                  break
              except Exception as err:
                  body = ""
                  if hasattr(err, "read"):
                      try:
                          body = err.read().decode("utf-8", "replace")[:200].replace("\n", " ")
                      except Exception:
                          pass
                  print("failed:", endpoint, "->", type(err).__name__, err, body)

          if data is None:
              raise SystemExit("every Overpass mirror refused the query")

          els = data.get("elements", [])
          print("elements returned:", len(els))

          def bearing(a, b):
              la1, la2 = math.radians(a["lat"]), math.radians(b["lat"])
              dlon = math.radians(b["lon"] - a["lon"])
              y = math.sin(dlon) * math.cos(la2)
              x = math.cos(la1) * math.sin(la2) - math.sin(la1) * math.cos(la2) * math.cos(dlon)
              return (math.degrees(math.atan2(y, x)) + 360) % 360

          def metres(a, b):
              R = 6371008.8
              la1, la2 = math.radians(a["lat"]), math.radians(b["lat"])
              dla = la2 - la1
              dlo = math.radians(b["lon"] - a["lon"])
              h = math.sin(dla / 2) ** 2 + math.cos(la1) * math.cos(la2) * math.sin(dlo / 2) ** 2
              return 2 * R * math.asin(min(1, math.sqrt(h)))

          for e in els:
              tags = e.get("tags", {})
              g = e.get("geometry") or []
              print()
              print("ref:", tags.get("ref"), "| id:", e.get("id"), "| points:", len(g))
              if len(g) >= 2:
                  a, b = g[0], g[-1]
                  print("  end A: %.6f, %.6f" % (a["lat"], a["lon"]))
                  print("  end B: %.6f, %.6f" % (b["lat"], b["lon"]))
                  print("  computed length: %.0f m" % metres(a, b))
                  print("  computed true bearing A->B: %.1f deg" % bearing(a, b))
              print("  tags:", json.dumps(tags, ensure_ascii=False, sort_keys=True))
          PY
