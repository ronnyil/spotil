name: Health check

# Checks the live data path end to end and on a schedule, because the site
# breaking is not self-announcing: the client falls back to the time-of-day
# prediction and keeps looking plausible, so a silent outage can persist until
# somebody happens to notice the amber label.

on:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      # Anything the live data path depends on. data/ and js/ are included
      # because a change to the runway geometry or the detector can break the
      # reading without touching the proxy at all.
      - "data/**"
      - "js/**"
      - "api/**"
      - "shared/**"
      - ".github/workflows/health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the proxy URL is usable from a browser
        run: python3 scripts/validate-config.py

      - name: Check the configured proxy
        id: proxy
        run: |
          PROXY=$(python3 -c "import json; print(json.load(open('data/config.json')).get('adsbProxy',''))")
          if [ -z "$PROXY" ]; then
            echo "No adsbProxy configured; nothing to check."
            exit 0
          fi
          PROXY="${PROXY%/}"

          # A bare status code cannot distinguish "no route" from "connection
          # refused" from "TLS failure", and 000 means no HTTP response at all.
          # Ask curl for its own error text, and try the endpoint three ways so
          # a working root with a dead function is immediately visible.
          probe_url() {
            echo "> $1"
            rm -f /tmp/resp.json /tmp/hdr.txt
            curl -sS -m 25 -o /tmp/resp.json -D /tmp/hdr.txt \
              -w '  code=%{http_code} exit=%{exitcode} err=%{errormsg} time=%{time_total}s\n' \
              "$1" || echo "  curl failed"
            if [ -s /tmp/hdr.txt ]; then
              echo "  --- response headers ---"
              sed 's/^/  /' /tmp/hdr.txt | head -12
            fi
            if [ -s /tmp/resp.json ]; then
              echo "  --- body (first 600) ---"
              head -c 600 /tmp/resp.json | sed 's/^/  /'
              echo
            fi
          }

          echo "=== the query the site actually makes ==="
          probe_url "$PROXY?lat=32.0094&lon=34.8828&radius=20"
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "$PROXY?lat=32.0094&lon=34.8828&radius=20" || true)

          echo
          echo "=== same endpoint with no query: should be 400 if the function exists ==="
          probe_url "$PROXY"

          echo
          echo "=== a path that certainly does not exist: shows what a 404 looks like here ==="
          probe_url "https://spotil.vercel.app/api/__does-not-exist"

          echo "code=${code:-000}" >> "$GITHUB_OUTPUT"

      - name: Check the deployment is serving at all
        if: always()
        continue-on-error: true
        run: |
          for u in https://spotil.vercel.app/ https://ronnyil.github.io/spotil/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "$u" || true)
            printf '%-40s %s\n' "$u" "${code:-000}"
          done

      - name: Probe the upstreams directly
        if: always()
        continue-on-error: true
        run: |
          probe() {
            code=$(curl -sS -m 15 -o /tmp/u.txt -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'User-Agent: spotil/1.0 (+https://github.com/ronnyil/spotil)' \
              "$2" || true)
            printf '%-16s %s  ' "$1" "${code:-000}"
            head -c 140 /tmp/u.txt 2>/dev/null | tr -d '\n'
            echo
            rm -f /tmp/u.txt
          }
          L=32.0094; O=34.8828; R=20
          probe "adsb.lol"       "https://api.adsb.lol/v2/point/$L/$O/$R"
          probe "adsb.fi"        "https://opendata.adsb.fi/api/v2/lat/$L/lon/$O/dist/$R"
          probe "airplanes.live" "https://api.airplanes.live/v2/point/$L/$O/$R"

      - name: Fail if the proxy is not healthy
        if: always()
        run: |
          code="${{ steps.proxy.outputs.code }}"
          if [ -n "$code" ] && [ "$code" != "200" ]; then
            echo "::error::Proxy returned HTTP $code - see the body and probes above"
            exit 1
          fi
          echo "Proxy healthy (HTTP ${code:-n/a})"
