<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TLV Spotting - where to stand right now</title>
<meta name="description" content="Live runway-in-use at Ben Gurion Airport, and the best spotting location for it right now.">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">✈</span>
    <span>
      <strong data-i18n="title">TLV Spotting</strong>
      <small data-i18n="tagline">Where to stand, right now</small>
    </span>
  </div>
  <button id="langToggle" class="lang" type="button" aria-label="Switch language">עברית</button>
</header>

<div id="safety" class="safety" hidden>
  <p data-i18n="safety"></p>
  <button id="safetyDismiss" type="button" data-i18n="dismiss">Got it</button>
</div>

<main>
  <section class="config" aria-live="polite">
    <button type="button" class="op is-selected" data-op="landing" aria-pressed="true">
      <span class="op-name"><span class="op-arrow" aria-hidden="true">↓</span><span data-i18n="landingShort">Landing</span></span>
      <span class="rwy" id="landingRwy">--</span>
      <span class="basis" id="landingBasis"></span>
      <span class="meter"><span id="landingMeter"></span></span>
    </button>
    <button type="button" class="op" data-op="takeoff" aria-pressed="false">
      <span class="op-name"><span class="op-arrow" aria-hidden="true">↑</span><span data-i18n="takeoffShort">Departing</span></span>
      <span class="rwy" id="takeoffRwy">--</span>
      <span class="basis" id="takeoffBasis"></span>
      <span class="meter"><span id="takeoffMeter"></span></span>
    </button>
  </section>

  <section class="diagram">
    <div id="diagram"></div>
  </section>

  <p class="note" id="modeNote" hidden></p>

  <section id="recommendation" aria-live="polite"></section>

  <section class="traffic">
    <h3 data-i18n="liveTraffic">Live traffic</h3>
    <ul id="trafficList"></ul>
  </section>
</main>

<footer>
  <p class="status" id="status"></p>
  <p class="credits" dir="ltr">
    Runway data derived from community ADS-B
    (<a href="https://airplanes.live" rel="noopener">airplanes.live</a>,
    <a href="https://adsb.fi" rel="noopener">adsb.fi</a>,
    <a href="https://adsb.lol" rel="noopener">adsb.lol</a>).
    Spot knowledge from Moti Kaplan's post in
    <span dir="rtl">חובבי הספוטינג בישראל</span> and public spotting guides.
    Not for operational use.
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
