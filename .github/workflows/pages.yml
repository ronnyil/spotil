name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A proxy URL that cannot work from a browser disables live data silently,
      # so it must not reach a deploy.
      - run: python3 scripts/validate-config.py

      # enablement turns Pages on for the repository if it is not already,
      # so no manual settings toggle is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files at the repository root - no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
